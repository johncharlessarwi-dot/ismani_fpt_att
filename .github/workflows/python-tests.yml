name: Attendance Python Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test 01
        run: python -m unittest discover -s tests -p 'test_01.py' -v
        env:
          SECRET_KEY: test-only-secret-key
          ADMIN_TOKEN: test-only-admin-token-1234567890
      - name: Test 02
        run: python -m unittest discover -s tests -p 'test_02.py' -v
